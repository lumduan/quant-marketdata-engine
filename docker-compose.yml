services:
  marketdata-engine:
    build: .
    # PID-1 reaper (tini, best practice): uvicorn runs as PID 1 and does not
    # wait() on children; `init: true` injects tini as PID 1 to reap any
    # orphaned healthcheck/subprocess child and forward signals cleanly.
    init: true
    container_name: quant-marketdata-engine
    restart: always
    ports:
      # Host-side port overridable via MARKETDATA_ENGINE_HOST_PORT (defaults 8300).
      - "${MARKETDATA_ENGINE_HOST_PORT:-8300}:8000"
    environment:
      # Public-safe defaults: read-only, NO tvkit cookie. Owner/ingest mode is the
      # docker-compose.private.yml overlay (which flips PUBLIC_MODE + supplies .env).
      MARKETDATA_ENGINE_PUBLIC_MODE: "true"
      MARKETDATA_ENGINE_PG_DSN: "postgresql://quant:quant@quant-postgres:5432/db_market_data"
      MARKETDATA_ENGINE_REDIS_URL: "redis://marketdata-redis:6379/0"
      MARKETDATA_ENGINE_LOG_LEVEL: "INFO"
    depends_on:
      marketdata-redis:
        condition: service_healthy
    # 🔴 The healthcheck asserts the BODY, not just the status code.
    #
    # /health deliberately returns 200 while degraded, so a probe can tell
    # "process up, dependency down" from "process down" (docs/api/health.md).
    # Checking only the status therefore reported `healthy` for 33 h on
    # 2026-09-10/11 while every /ohlcv request returned 503 — the container was
    # the last place that could have said otherwise, and it said nothing.
    #
    # ⚠️ This makes the fault VISIBLE; it does not self-heal. Docker's `restart:`
    # policy does not act on health status — only a `depends_on:
    # condition: service_healthy` and human/monitor eyes do. The recovery is
    # in-process: db/postgres.py::ensure_pool re-opens the pool on demand.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import json,urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0 if r.status==200 and json.load(r).get('db') is True else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # The engine's OWN Redis sidecar (ADR D8) — distinct from the gateway's
  # quant-redis. Internal-only (no host port) to avoid clashing with :6379.
  marketdata-redis:
    image: redis:7-alpine
    container_name: quant-marketdata-redis
    restart: always
    volumes:
      - marketdata_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  marketdata_redis_data:

networks:
  default:
    name: quant-network
    external: true
